        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
      <script src="js/dark-mode.js"></script>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">📚 English Seekho</div>
        <!-- Ye button add karo -->
        <button class="menu-toggle" id="menuToggle" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <ul class="nav-links" id="navLinks">

    <!-- Page Header -->
    <header class="page-header">
        <h1>🎮 Word Scramble</h1>
        <p>Ulte-pulte letters ko sahi karke word banao!</p>
    </header>

    <!-- Game Container -->
    <main class="game-container">
        <div class="game-card">

            <!-- Game Stats -->
            <div class="game-stats">
                <span>⭐ Score: <strong id="gameScore">0</strong></span>
                <span>❤️ Lives: <strong id="gameLives">3</strong></span>
            </div>

            <!-- Hint -->
            <div class="hint-box" id="hintBox">
                <!-- Hint yahan aayega -->
            </div>

            <!-- Scrambled Word -->
            <h2 class="scrambled-word" id="scrambledWord">L O A D I N G</h2>

            <!-- Input -->
            <input type="text" id="userInput" class="game-input" placeholder="Yahan sahi word likhein..."
                autocomplete="off" autocapitalize="off" spellcheck="false">

            <!-- Buttons -->
            <div class="game-actions">
                <button class="btn btn-primary" id="submitBtn">Check Karo</button>
                <button class="btn btn-secondary" id="skipBtn">Skip / Next</button>
            </div>

            <!-- Feedback -->
            <div class="game-feedback" id="gameFeedback"></div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2025 English Seekho | Made with ❤️</p>
    </footer>

    <!-- Game JS -->
    <script src="js/game.js"></script>
<script src="js/navbar.js"></script> 
 <script src="js/nav-updater.js"></script>   

</body>
