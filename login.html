        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase SDK (CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Yahan apna firebaseConfig paste karo
        const firebaseConfig = {
            apiKey: "AIzaSyA8GI6ny8Z6gUNFirtp_Qs77HbaAWir7Z0",
            authDomain: "english-seekho-v2.firebaseapp.com",
            projectId: "english-seekho-v2",
            storageBucket: "english-seekho-v2.firebasestorage.app",
            messagingSenderId: "393175002297",
            appId: "1:393175002297:web:8ac546459c7fa803917f68"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.firebaseAuth = auth;
        window.firebaseCreateUser = createUserWithEmailAndPassword;
        window.firebaseSignIn = signInWithEmailAndPassword;
        window.firebaseOnAuth = onAuthStateChanged;

        console.log('✅ Firebase Auth initialized');
    </script>
      <script src="js/dark-mode.js"></script>
</head>

<body>

    <nav class="navbar">

            <li><a href="leaderboard.html">Leaderboard</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
        </ul>
    </nav>

    <!-- Page Header -->
    <header class="page-header">
        <h1>🔐 Apna Account Banayein</h1>
        <p>Login karein taaki aapki progress save rahe!</p>
    </header>

    <!-- Login Container -->
    <main class="login-container">
        <div class="login-card">

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLogin">Login</button>
                <button class="auth-tab" id="tabSignup">Sign Up</button>
            </div>

            <!-- Form -->
            <form id="authForm">
                <div class="form-group">
                    <label for="authEmail">Email:</label>
                    <input type="email" id="authEmail" placeholder="aapka@email.com" required>
                </div>

                <div class="form-group">
                    <label for="authPassword">Password:</label>
                    <input type="password" id="authPassword" placeholder="Password daalein..." required>
                </div>

                <button type="submit" class="btn btn-primary" id="authSubmitBtn" style="width:100%;">Login
                    Karein</button>

                <div id="authError" class="auth-error" style="display:none;"></div>
            </form>

        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
